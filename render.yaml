# Render Blueprint. Create it from this repository: New > Blueprint.
# Every secret is marked sync: false, so Render asks for its value in the dashboard
# and it never lives in the repository.
#
# One service:
#   mapoly-api      web service: the FastAPI app. Runs db_setup before each deploy.
#
# There are no cron jobs. Expired plans are ended on login and dashboard visits, and
# unused login tokens expire in RADIUS itself. The CoA worker runs on the AAA VM.
#
# The database is Supabase (PostgreSQL). SQLite is for local development only, because
# these services run in separate containers and cannot share a SQLite file.

services:
  - type: web
    name: mapoly-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # a paid plan avoids the cold start that delays first login
    healthCheckPath: /api/health
    preDeployCommand: python -m app.db_setup
    dockerCommand: sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADIUS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mapolywifi.vercel.app
      - key: LOGIN_TOKEN_TTL_SECONDS
        value: "60"
      - key: DEFAULT_MAX_DEVICES
        value: "0"  # 0 = no limit on devices per account
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: STALE_SESSION_MINUTES
        value: "15"
      - key: COA_NAS_HOST
        sync: false
      - key: RADIUS_COA_SECRET
        sync: false
