# Render Blueprint. Create it from this repository: New > Blueprint.
# Every secret is marked sync: false, so Render asks for its value in the dashboard
# and it never lives in the repository.
#
# Three services, one image:
#   mapoly-api      web service: the FastAPI app. Runs db_setup before each deploy.
#   mapoly-expiry   cron: ends expired plans, every minute
#   mapoly-cleanup  cron: removes expired login tokens and old audit rows, every minute
#
# The database is Supabase (PostgreSQL). SQLite is for local development only, because
# these services run in separate containers and cannot share a SQLite file.

services:
  - type: web
    name: mapoly-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # a paid plan avoids the cold start that delays first login
    healthCheckPath: /api/health
    preDeployCommand: python -m app.db_setup
    dockerCommand: sh -c "exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADIUS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mapolywifi.vercel.app
      - key: LOGIN_TOKEN_TTL_SECONDS
        value: "60"
      - key: DEFAULT_MAX_DEVICES
        value: "2"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: STALE_SESSION_MINUTES
        value: "15"
      - key: COA_NAS_HOST
        sync: false
      - key: RADIUS_COA_SECRET
        sync: false

  - type: cron
    name: mapoly-expiry
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: python -m app.jobs.expiry
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADIUS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mapolywifi.vercel.app
      - key: COA_NAS_HOST
        sync: false
      - key: RADIUS_COA_SECRET
        sync: false

  - type: cron
    name: mapoly-cleanup
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: python -m app.jobs.cleanup
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADIUS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://mapolywifi.vercel.app
