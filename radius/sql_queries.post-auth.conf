# Replace the existing post-auth { } block in
# /etc/freeradius/3.0/mods-config/sql/main/postgresql/queries.conf with this block.
#
# Runs after authentication. It deletes the token only when this attempt was accepted
# and the password matches the stored token. A rejected attempt leaves the token alone,
# so a student can retry from the right device.
#
# Values are escaped by rlm_sql before they reach PostgreSQL.

post-auth {
	query = "DELETE FROM radcheck WHERE username = '%{User-Name}' AND attribute = 'Cleartext-Password' AND value = '%{User-Password}' AND '%{reply:Packet-Type}' = 'Access-Accept'"
}
